name: Release to PyPI
on:
  workflow_dispatch:

env:
  PIP_INDEX_URL: https://:2023-06-12T22:02:08.030388Z@time-machines-pypi.sealsecurity.io/

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup python to build package
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install build
        run: python -m pip install build
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Pin build backend to the hatchling the release was built with
        run: echo "hatchling==1.18.0" > "$RUNNER_TEMP/build-constraints.txt"
      - name: Build package
        run: pyproject-build -s -w . -o dist
        env:
          PIP_CONSTRAINT: ${{ runner.temp }}/build-constraints.txt
          SETUPTOOLS_SCM_PRETEND_VERSION: "3.12.2"
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
