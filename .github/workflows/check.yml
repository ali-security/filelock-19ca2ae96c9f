name: check
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "pytest selector to run instead of the full suite"
        required: false
        default: ""

env:
  PIP_INDEX_URL: https://:2023-06-12T22:02:08.030388Z@time-machines-pypi.sealsecurity.io/

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.py }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        py:
          - "3.12.0-beta.1"
          - "3.11"
          - "3.10"
          - "3.9"
          - "3.8"
          - "3.7"
          - "pypy3.9"
          - "pypy3.8"
          - "pypy3.7"
        os:
          - ubuntu-22.04
          - windows-2022
          - macos-15-intel

    steps:
      - name: Setup python for tox
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install tox
        run: python -m pip install tox
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - if: ${{ runner.os == 'macOS' && startsWith(matrix.py, '3.12') }}
        name: Remove runner image's Python 3.12 framework (its pip does not run on 3.12.0b1)
        run: sudo rm -rf /Library/Frameworks/Python.framework/Versions/3.12
      - name: Setup python for test ${{ matrix.py }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.py }}
        env:
          PIP_INDEX_URL: ${{ startsWith(matrix.py, 'pypy') && 'https://pypi.org/simple/' || env.PIP_INDEX_URL }}
      - name: Pick environment to run
        run: |
          import os; import platform; import sys; from pathlib import Path
          env = f'TOXENV=py{"" if platform.python_implementation() == "CPython" else "py"}3{sys.version_info.minor}'
          print(f"Picked: {env} for {sys.version} based of {sys.executable}")
          with Path(os.environ["GITHUB_ENV"]).open("ta") as file_handler:
              file_handler.write(env)
        shell: python
      - name: Setup test suite
        run: tox r -vv --notest
      - if: ${{ startsWith(matrix.py, 'pypy') && inputs.test-filter == '' }}
        name: Run test suite
        run: tox r --skip-pkg-install --
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
          CI_RUN: "yes"
      - if: ${{ !startsWith(matrix.py, 'pypy') && inputs.test-filter == '' }}
        name: Run test suite
        run: tox r --skip-pkg-install
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
          CI_RUN: "yes"
          DIFF_AGAINST: HEAD
      - if: ${{ inputs.test-filter != '' }}
        name: Run filtered test suite
        run: tox r --skip-pkg-install -- ${{ inputs.test-filter }}
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
          CI_RUN: "yes"

  coverage:
    name: Combine coverage
    if: false
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install tox
        run: python -m pip install tox
      - name: Setup coverage tool
        run: tox -e coverage --notest
      - name: Install package builder
        run: python -m pip install build
      - name: Build package
        run: pyproject-build --wheel .
      - name: Download coverage data
        uses: actions/download-artifact@v3
        with:
          name: coverage-data
          path: .tox
      - name: Combine and report coverage
        run: tox -e coverage
      - name: Upload HTML report
        uses: actions/upload-artifact@v3
        with:
          name: html-report
          path: .tox/htmlcov

  check:
    name: ${{ matrix.tox_env }} - ${{ matrix.os }}
    if: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2022
        tox_env:
          - dev
          - type
          - docs
          - readme
        exclude:
          - { os: windows-latest, tox_env: readme }
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Python "3.11"
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install tox
        run: python -m pip install tox
      - name: Setup test suite
        run: tox -vv --notest -e ${{ matrix.tox_env }}
      - name: Run test suite
        run: tox --skip-pkg-install -e ${{ matrix.tox_env }}
